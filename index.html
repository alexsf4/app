<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c0f16">
<title>Para ti</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="29">

<style>
:root{
  --bg:#1c0f16; --panel:#2b1621; --hover:#3a1e2c; --text:#fff5f8; --muted:#d9b3c3; --rosa:#ff6b9d; --linea:#3d2431; --barra:#12080d; --track:#5c3a4a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Circular","Helvetica Neue",Helvetica,Arial,sans-serif;padding-bottom:130px}
button{background:none;border:0;color:inherit;cursor:pointer;font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--rosa);outline-offset:2px}
input[type=text],input[type=password]{background:var(--panel);border:1px solid var(--linea);color:var(--text);border-radius:8px;padding:10px 12px;font:inherit;min-width:0}

.hero{display:flex;gap:24px;align-items:flex-end;padding:56px 32px 28px;background:linear-gradient(180deg,#d1457a 0%,#7a2a4d 45%,#3a1627 75%,var(--bg) 100%)}
.cover{width:min(232px,38vw);aspect-ratio:1;object-fit:cover;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.55);background:#4a2234;flex:none}
.hero small{font-size:.8rem;font-weight:700}
.hero h1{font-size:clamp(2rem,7vw,5rem);line-height:1.02;font-weight:900;letter-spacing:-.03em;margin:8px 0 14px}
.hero p{color:#f3cfdc;font-size:.9rem;line-height:1.5}
.hero p b{color:var(--text)}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:18px 32px 6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;background:var(--panel);border:1px solid var(--linea);font-size:.9rem}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--rosa);color:#2b0f1a;border-color:var(--rosa);font-weight:700}
.btn{padding:8px 16px;border-radius:20px;border:1px solid var(--rosa);color:var(--rosa);font-size:.9rem}
.btn:hover{background:var(--rosa);color:#2b0f1a}
.top .btn{margin-left:auto}

.aviso{margin:12px 32px 0;padding:14px 16px;border-radius:10px;background:#4a1d2e;border:1px solid var(--rosa);color:var(--text);font-size:.9rem;line-height:1.5;max-width:640px}
.panel{margin:12px 32px 0;max-width:640px}
.fila{display:flex;gap:8px}
.fila input{flex:1}
.fila .btn{flex:none}

.res{margin-top:10px;border-radius:10px;background:var(--panel);border:1px solid var(--linea);overflow:hidden}
.res .it{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--linea)}
.res .it:last-child{border-bottom:0}
.res img{width:64px;height:48px;object-fit:cover;border-radius:4px;background:#4a2234;flex:none}
.res .tx{flex:1;min-width:0}
.res .tx .t{font-size:.88rem;line-height:1.3;max-height:2.6em;overflow:hidden}
.res .tx .a{font-size:.75rem;color:var(--muted);margin-top:2px}
.res .btn{padding:6px 12px;font-size:.8rem;flex:none}
.res .btn[disabled]{opacity:.5;cursor:default;background:none;color:var(--rosa)}
.nota{color:var(--muted);font-size:.85rem;padding:12px}

.top #btnAnadir{margin-left:auto}
.top #btnEditar{margin-left:0}
.top .edit-only{display:none}
body.edit .top .edit-only{display:inline-block}
#buscador[hidden]{display:none!important}
.estado{color:var(--muted);font-size:.85rem;margin-top:8px;line-height:1.4}
.claves{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.claves p{color:var(--muted);font-size:.8rem;line-height:1.4}
.edit-only{display:none}
body.edit .edit-only{display:block}

.player{display:flex;gap:16px;align-items:center;padding:20px 32px 6px}
#ytwrap,#mp3box,#fotobox{width:100%;max-width:356px;height:200px;border-radius:12px;overflow:hidden;background:#000;flex:none}
#ytwrap{display:none}
#fotobox{background:var(--panel)}
#fotobox img{width:100%;height:100%;object-fit:cover;object-position:var(--pos-foto,center);display:block}
#mp3box{display:none;background:var(--panel);align-items:center;justify-content:center}
#mp3box img{width:100%;height:100%;object-fit:cover}
#ytwrap iframe{width:100%;height:100%;display:block}

.list{padding:10px 16px 0}
.head,.row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:8px 16px;border-radius:6px}
.head{color:var(--muted);font-size:.8rem;border-bottom:1px solid var(--linea);border-radius:0;margin-bottom:8px}
.row{cursor:pointer}
.row:hover{background:var(--hover)}
.row .n{color:var(--muted);text-align:center}
.row .info{display:flex;gap:12px;align-items:center;min-width:0}
.row .info img{width:44px;height:44px;border-radius:4px;object-fit:cover;background:#4a2234;flex:none}
.row .t{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{display:block;color:var(--muted);font-size:.85rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .x,.row .ed{display:none;color:var(--muted);font-size:1.1rem;padding:6px 8px;border-radius:50%}
body.edit .row .x,body.edit .row .ed{display:inline-block}
.row .ed:hover{color:#fff;background:#6a2a42}
.row .x:hover{color:#fff;background:#6a2a42}
.row.on .t,.row.on .n{color:var(--rosa)}
.vacio{color:var(--muted);padding:24px 16px;font-size:.9rem}

.msg{margin:40px 32px 0;padding:24px;border-radius:12px;background:var(--panel);border:1px solid var(--linea);max-width:560px;line-height:1.6;color:var(--muted)}
.msg h2{color:var(--rosa);font-size:1.1rem;margin-bottom:8px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--barra);border-top:1px solid var(--linea);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 2fr 1fr;gap:16px;align-items:center}
.now{display:flex;gap:12px;align-items:center;min-width:0}
.now img{width:56px;height:56px;border-radius:6px;object-fit:cover;background:#4a2234}
.now .t{font-size:.9rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .a{font-size:.75rem;color:var(--muted)}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.btns{display:flex;align-items:center;gap:20px}
.btns svg{width:20px;height:20px;fill:var(--muted)}
.btns button:hover svg{fill:#fff}
.btns .pp{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center}
.btns .pp svg{fill:#2b0f1a;width:16px;height:16px}
.btns .pp:hover{transform:scale(1.06)}
.seek{display:flex;align-items:center;gap:8px;width:100%;max-width:560px;font-size:.7rem;color:var(--muted)}
.seek input{flex:1}
.vol{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.vol input{width:100px}
.vol svg{width:18px;height:18px;fill:var(--muted)}

input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,#fff var(--v,0%),var(--track) var(--v,0%));cursor:pointer;padding:0;border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0}
input[type=range]:hover{background:linear-gradient(to right,var(--rosa) var(--v,0%),var(--track) var(--v,0%))}
input[type=range]:hover::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}

.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#fff;color:#2b0f1a;padding:10px 18px;border-radius:6px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:10}
.toast.show{opacity:1}

@media (max-width:700px){
  .hero{flex-direction:column;align-items:flex-start;padding:40px 20px 20px}
  .top{padding:16px 20px 4px}
  .aviso,.panel{margin-left:20px;margin-right:20px}
  .player{padding:16px 20px 4px}
  .list{padding:10px 4px 0}
  .msg{margin:32px 20px 0}
  .bar{grid-template-columns:1fr auto;grid-template-rows:auto auto}
  .mid{grid-column:1/-1;grid-row:2}
  .vol{display:none}
  body{padding-bottom:170px}
  .toast{bottom:180px}
}
.bar{z-index:6}
.now{cursor:pointer}
.visor{position:fixed;inset:0;z-index:5;background:#12080d;overflow:hidden}
.visor[hidden]{display:none}
.vfondo{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(60px) brightness(.5) saturate(1.5)}
.vx{position:absolute;top:14px;left:16px;z-index:2;font-size:1.2rem;padding:8px 12px;border-radius:50%;color:#fff;background:rgba(0,0,0,.35)}
.vcont{position:relative;height:100%;display:grid;grid-template-columns:minmax(240px,400px) 1fr;gap:48px;align-items:center;padding:70px 48px 110px}
.vizq img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;box-shadow:0 12px 50px rgba(0,0,0,.6);background:#4a2234}
.vt{font-size:1.2rem;font-weight:700;margin-top:16px}
.va{color:#f3cfdc;margin-top:4px}
.vder{height:100%;min-height:0;display:flex;flex-direction:column}
.vbusca{display:flex;gap:8px;margin-bottom:6px}
.vbusca input{flex:1}
.letra{position:relative;flex:1;overflow-y:auto;scrollbar-width:none;padding:25vh 0;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.letra::-webkit-scrollbar{display:none}
.letra p{font-size:clamp(1.3rem,3vw,2.3rem);font-weight:800;line-height:1.25;margin:0 0 20px;color:rgba(255,255,255,.35);cursor:pointer;transition:color .3s,transform .3s;transform-origin:left}
.letra p:hover{color:rgba(255,255,255,.65)}
.letra p.on{color:#fff;transform:scale(1.03)}
.letra.plana p{color:rgba(255,255,255,.85);cursor:default}
.letra .aviso2{color:#f3cfdc;font-size:1rem;padding:20px 0}
@media (max-width:700px){
  .vcont{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:10px;padding:60px 20px 160px;align-items:start}
  .vizq{display:flex;gap:12px;align-items:center}
  .vizq img{width:72px}
  .vt{margin-top:0;font-size:1rem}
  .letra{padding:12vh 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Pantalla de bienvenida ===== */
html.sin-bienvenida #bienvenida{display:none}
body.bloqueado{overflow:hidden}
#bienvenida{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(circle at 50% 30%,#7a2a4d 0%,#3a1627 55%,#12080d 100%);transition:opacity .8s ease,visibility .8s}
#bienvenida[hidden]{display:none}
#bienvenida.sale{opacity:0;visibility:hidden}
#petalos{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#petalos i{position:absolute;top:-30px;background:var(--rosa);border-radius:70% 0 70% 0;animation:cae linear infinite}
@keyframes cae{0%{transform:translate3d(0,-30px,0) rotate(0)}50%{transform:translate3d(28px,55vh,0) rotate(180deg)}100%{transform:translate3d(-20px,110vh,0) rotate(360deg)}}
.sobre{position:relative;width:200px;height:136px;margin-bottom:38px;border-radius:10px;background:linear-gradient(180deg,#ffb3cf,#ff6b9d);box-shadow:0 14px 40px rgba(255,107,157,.35);perspective:600px}
.solapa{position:absolute;top:0;left:0;width:100%;height:82px;background:#ff8fb5;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease;z-index:3}
.sello{position:absolute;left:50%;top:58px;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:#c2306a;display:grid;place-items:center;z-index:4;transition:opacity .4s}
.sello svg,.papel svg{width:22px;height:22px;fill:#ffd6e6}
.papel{position:absolute;left:14px;right:14px;top:12px;height:104px;background:#fff5f8;border-radius:8px;display:grid;place-items:center;z-index:2;opacity:0;transition:transform .8s ease .3s,opacity .5s ease .3s}
.papel svg{width:34px;height:34px;fill:var(--rosa)}
#bienvenida.abierto .solapa{transform:rotateX(180deg)}
#bienvenida.abierto .sello{opacity:0}
#bienvenida.abierto .papel{opacity:1;transform:translateY(-38px)}
#bienvenida h2{position:relative;font-size:clamp(1.7rem,8vw,2.4rem);font-weight:900;letter-spacing:-.02em;line-height:1.1;margin-bottom:12px}
#bienvenida p{position:relative;color:#f3cfdc;font-size:1rem;line-height:1.5;margin-bottom:30px;max-width:320px}
.btnbv{position:relative;padding:13px 30px;border-radius:26px;background:var(--rosa);color:#2b0f1a;font-weight:700;font-size:1rem;transition:transform .15s}
.btnbv:hover{transform:scale(1.05)}

/* ===== Tiempo juntos + mensaje ===== */
.juntos{padding:6px 32px 0;max-width:704px}
.juntos .et{color:var(--muted);font-size:.85rem;margin-top:12px}
.cont{display:flex;gap:8px;margin-top:10px}
.cont div{flex:1;min-width:0;background:var(--panel);border:1px solid var(--linea);border-radius:12px;text-align:center;padding:10px 2px}
.cont b{display:block;font-size:clamp(1.1rem,5.2vw,1.6rem);color:var(--rosa);font-weight:900;font-variant-numeric:tabular-nums}
.cont span{font-size:.68rem;color:var(--muted)}
.total{color:var(--muted);font-size:.78rem;margin-top:8px}
.dia{margin-top:14px;padding:16px;border-radius:14px;background:#4a1d2e;border:1px solid var(--rosa);font-size:1rem;line-height:1.55}
.dia small{display:block;color:var(--rosa);font-weight:800;font-size:.7rem;letter-spacing:.08em;margin-bottom:6px}
.corazon svg{width:1em;height:1em;fill:var(--rosa);vertical-align:-.12em}

/* ===== Herramientas de la lista ===== */
.herr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 32px 0;max-width:704px}
.chip{padding:7px 14px;border-radius:18px;border:1px solid var(--linea);background:var(--panel);font-size:.82rem;color:var(--muted)}
.chip:hover{background:var(--hover)}
.chip.on{border-color:var(--rosa);color:var(--rosa)}
.herr input{flex:1 1 100%}
.row .acc{display:flex;align-items:center;gap:2px}
.row .fv{display:grid;place-items:center;padding:6px;border-radius:50%;color:var(--muted)}
.row .fv svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.row .fv:hover{color:#fff}
.row .fv.on{color:var(--rosa)}
.row .fv.on svg{fill:var(--rosa);stroke:var(--rosa)}
.row .pie{display:block;margin-top:6px;font-size:.8rem;line-height:1.4;color:#f3cfdc;font-style:italic;background:#3a1627;border-left:3px solid var(--rosa);padding:5px 9px;border-radius:0 8px 8px 0;white-space:normal}
.row .eq{display:none;gap:2px;align-items:flex-end;height:16px;margin-right:6px}
.row.on .eq{display:flex}
.eq i{display:block;width:3px;height:100%;background:var(--rosa);border-radius:2px;transform-origin:bottom;transform:scaleY(.3);animation:eq .9s ease-in-out infinite alternate;animation-play-state:paused}
body.sonando .eq i{animation-play-state:running}
.eq i:nth-child(2){animation-delay:-.3s;animation-duration:.7s}
.eq i:nth-child(3){animation-delay:-.6s;animation-duration:1.1s}
.eq i:nth-child(4){animation-delay:-.2s;animation-duration:.8s}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.vn{color:#f3cfdc;font-style:italic;margin-top:10px;font-size:.9rem;line-height:1.4;max-width:380px}
.vn:empty{display:none}
@media (max-width:700px){
  .juntos{padding:6px 20px 0}
  .herr{padding:14px 20px 0}
  .row .a{white-space:normal}
}
@media (prefers-reduced-motion:reduce){
  #petalos{display:none}
  .eq i{animation:none!important;transform:scaleY(.6)}
}
/* ===== Páginas ===== */
body[data-pagina="tiempo"] .p-lista,body[data-pagina="tiempo"] .p-juego,body[data-pagina="tiempo"] .p-puzzle{display:none!important}
body[data-pagina="playlist"] .p-tiempo,body[data-pagina="playlist"] .p-juego,body[data-pagina="playlist"] .p-puzzle{display:none!important}
body[data-pagina="juego"] .p-tiempo,body[data-pagina="juego"] .p-lista,body[data-pagina="juego"] .p-puzzle{display:none!important}
body[data-pagina="puzzle"] .p-tiempo,body[data-pagina="puzzle"] .p-lista,body[data-pagina="puzzle"] .p-juego{display:none!important}
body[data-pagina="puzzle"]:not(.tiene-cancion) .bar{display:none}
body[data-pagina="puzzle"]:not(.tiene-cancion){padding-bottom:40px}
body[data-pagina="tiempo"] .bar{display:none}
body[data-pagina="juego"]:not(.tiene-cancion) .bar{display:none}
body[data-pagina="tiempo"],body[data-pagina="juego"]:not(.tiene-cancion){padding-bottom:40px}
.pagina{animation:entra .5s ease both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.irlista{padding:22px 32px 0;max-width:704px}
.irlista .btnbv{width:100%;max-width:420px}
.cabeza{display:flex;align-items:center;gap:12px;padding:20px 32px 0}
.cabeza #cabezaTitulo{font-weight:800;font-size:1.05rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:700px){
  .irlista{padding:22px 20px 0}
  .cabeza{padding:18px 20px 0}
}
@media (prefers-reduced-motion:reduce){.pagina{animation:none}}

/* ===== Nuestro cielo ===== */
.cielo{padding:28px 32px 0;max-width:704px}
.cielo h2{font-size:1.05rem;font-weight:800}
.cielo .fecha{color:var(--muted);font-size:.85rem;margin-top:3px}
.cielo-caja{position:relative;margin-top:12px;max-width:420px;aspect-ratio:4/5;border-radius:16px;overflow:hidden;border:1px solid var(--linea);background:#14081f;touch-action:pan-y}
.cielo-caja canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cielo .texto{margin-top:12px;line-height:1.5;font-size:.95rem}
.cielo .chip{margin-top:12px}
.btnbv.sec{background:transparent;border:1px solid var(--rosa);color:var(--rosa)}
.btnbv.sec:hover{background:var(--rosa);color:#2b0f1a}
.irlista.dos{padding-top:12px}
/* ===== Juego ===== */
.cabeza .ct{font-weight:800;font-size:1.05rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.juego{padding:18px 32px 0;max-width:704px}
.jinfo{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:.85rem;margin-bottom:8px;font-variant-numeric:tabular-nums}
.jinfo b{color:var(--rosa)}
#jPuntos{color:var(--text);font-weight:800;font-size:1.15rem}
.jcaja{position:relative;height:220px;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--linea);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.jcaja canvas{width:100%;height:100%;display:block}
.jmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 22px;background:rgba(28,15,22,.55);font-weight:800;line-height:1.35;pointer-events:none}
.jmsg[hidden]{display:none}
.jmsg small{display:block;color:var(--muted);font-weight:400;margin-top:6px;font-size:.8rem}
.jayuda{color:var(--muted);font-size:.8rem;margin-top:10px;line-height:1.45}
@media (max-width:700px){
  .cielo{padding:26px 20px 0}
  .juego{padding:16px 20px 0}
}

/* ===== Rompecabezas ===== */
.puzzle{padding:18px 32px 0;max-width:704px}
.pz-fotos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pz-fotos button{flex:0 0 auto;width:60px;height:60px;border-radius:10px;border:2px solid var(--linea);background-size:cover;background-position:center;opacity:.65;transition:opacity .15s,border-color .15s}
.pz-fotos button.on{border-color:var(--rosa);opacity:1}
.pz-barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.pz-info{margin-left:auto;color:var(--muted);font-size:.85rem}
.pz-caja{position:relative;width:100%;max-width:440px;margin:0 auto}

const MSG_ANIMO = "VAMOS MI AMOR TU PUEDES YO CONFIO EN TI ❤";
const $ = id => document.getElementById(id);
const audio = $("audio");

const fmt = s => isFinite(s) && s > 0 ? Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0") : "0:00";
const PLAY = "M8 5v14l11-7z", PAUSE = "M6 5h4v14H6zm8 0h4v14h-4z";
const fill = el => el.style.setProperty("--v", (el.value - el.min) / (el.max - el.min) * 100 + "%");
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("show"),3200); }
function decodificar(s){ const t=document.createElement("textarea"); t.innerHTML=s; return t.value; }
function setAviso(txt){ const a=$("aviso"); if(txt){ a.textContent=txt; a.hidden=false; } else { a.hidden=true; } }

/* ---------- Almacenamiento en GitHub (listas.json) ---------- */
const G = CONFIG.github;
const API = "https://api.github.com/repos/" + G.usuario + "/" + G.repo + "/contents/";
const TOKEN_KEY = "regalo_gh";
const leerLS = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
const escribirLS = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
const token = () => leerLS(TOKEN_KEY);
const hdr = () => ({ Authorization: "Bearer " + token(), Accept: "application/vnd.github+json" });
const utf8aB64 = t => btoa(unescape(encodeURIComponent(t)));
const b64aUtf8 = b => decodeURIComponent(escape(atob(b.replace(/\s/g, ""))));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
if (!G.usuario || !G.repo) setAviso("Falta poner tu usuario y el nombre del repositorio de GitHub en CONFIG (mira INSTRUCCIONES.txt).");

let datos = {}, tEscritura = 0;
async function leerPublico(){
  const r = await fetch("listas.json?t=" + Date.now(), { cache: "no-store" });
  if (r.status === 404) return {};
  if (!r.ok) throw new Error("HTTP " + r.status);
  return await r.json();
}
async function leerApi(){
  const r = await fetch(API + "listas.json?ref=" + encodeURIComponent(G.rama || "main") + "&t=" + Date.now(), { headers: hdr(), cache: "no-store" });
  if (r.status === 404) return { data: {}, sha: null };
  if (!r.ok) throw new Error("GitHub respondió " + r.status + (r.status === 401 ? " (token inválido)" : ""));
  const j = await r.json();
  return { data: JSON.parse(b64aUtf8(j.content)), sha: j.sha };
}
async function modificarListas(fn, msg){
  for (let i = 0; i < 3; i++) {
    const { data, sha } = await leerApi();
    fn(data);
    const body = { message: msg, content: utf8aB64(JSON.stringify(data, null, 1)), branch: G.rama || "main" };
    if (sha) body.sha = sha;
    const r = await fetch(API + "listas.json", { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, hdr()), body: JSON.stringify(body) });
    if (r.ok) { datos = data; tEscritura = Date.now(); mostrarLista(); return; }
    if (r.status !== 409 && r.status !== 422) throw new Error("GitHub respondió " + r.status + (r.status === 401 ? " (token inválido)" : r.status === 403 ? " (al token le falta el permiso Contents: Read and write)" : ""));
  }
  throw new Error("No se pudo guardar, intenta otra vez");
}

/* ---------- Estado ---------- */
let listaActual = CONFIG.listas[0].id;
let canciones = [];       /* canciones de la pestaña que estás viendo */
let cola = [];            /* canciones de la lista que está sonando */
let idx = -1;
let sonandoDocId = null;
let modo = null;          /* "yt" o "mp3" */
let unsub = null;
let editando = false;
let abrirAlEntrar = false;

/* ---------- Pestañas ---------- */
function pintarTabs(){
  const cont = $("tabs"); cont.innerHTML = "";
  CONFIG.listas.forEach(l => {
    const b = document.createElement("button");
    b.className = "tab" + (l.id === listaActual ? " on" : "");
    b.textContent = l.nombre;
    b.onclick = () => { listaActual = l.id; pintarTabs(); cargarLista(); };
    cont.appendChild(b);
  });
}

function mostrarLista(){ canciones = datos[listaActual] || []; pintarFilas(); }
async function refrescar(){
  if (Date.now() - tEscritura < 180000) return; /* GitHub Pages tarda un poco en publicar los cambios */
  try {
    const d = await leerPublico();
    if (JSON.stringify(d) !== JSON.stringify(datos)) { datos = d; mostrarLista(); }
  } catch (e) { console.error(e); setAviso("No se pudo leer listas.json. Revisa que lo subiste al repositorio."); }
}
function cargarLista(){
  mostrarLista();
  if (!cargarLista.iniciado) { cargarLista.iniciado = true; refrescar(); setInterval(refrescar, 60000); }
}

/* ---------- Favoritas, filtros y fila de canciones ---------- */
const HEART_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6 5c2 0 3.4 1.1 4.2 2.4h3.6C14.6 6.1 16 5 18 5c3.3 0 5.1 3.4 3.6 6.8C19.5 16.4 12 21 12 21z"/></svg>';
let favs = new Set();   /* favoritas: se guardan en cada celular */
try { favs = new Set(JSON.parse(leerLS("regalo_fav") || "[]")); } catch (e) {}
let filtroTexto = "", soloFavs = false, aleatorio = false, repetir = "off", finDormir = 0, minDormir = 0;
const guardarFavs = () => escribirLS("regalo_fav", JSON.stringify([...favs]));
const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
/* docId empieza con la fecha en que se agregó (en base 36) */
const fechaDeId = id => { const n = parseInt(String(id || "").slice(0, 8), 36); return (n > 1.5e12 && n < 4e12) ? new Date(n) : null; };

function pintarFilas(){
  const rows = $("rows"); rows.innerHTML = "";
  if (!canciones.length) {
    const v = document.createElement("div"); v.className = "vacio";
    v.textContent = editando ? "Aún no hay canciones. Busca una arriba y pulsa Agregar." : "Aún no hay canciones en esta lista.";
    rows.appendChild(v); return;
  }
  const q = norm(filtroTexto), vis = [];
  canciones.forEach((c, i) => {
    if (soloFavs && !favs.has(c.docId)) return;
    if (q && !norm(c.titulo + " " + (c.artista || "")).includes(q)) return;
    vis.push({ c, i });
  });
  if (!vis.length) {
    const v = document.createElement("div"); v.className = "vacio";
    v.textContent = soloFavs && !q ? "Todavía no marcaste favoritas. Toca el corazón de una canción." : "No hay canciones que coincidan.";
    rows.appendChild(v); return;
  }
  const colaVisible = vis.map(x => x.c);
  vis.forEach(({ c, i }, pos) => {
    const prep = c.disponible && c.disponible > Date.now();
    const r = document.createElement("div");
    r.className = "row" + (c.docId === sonandoDocId ? " on" : "");
    const n = document.createElement("span"); n.className = "n"; n.textContent = i + 1;
    const info = document.createElement("span"); info.className = "info";
    const img = document.createElement("img"); img.alt = ""; img.src = c.thumb || CONFIG.foto;
    const tx = document.createElement("span"); tx.style.minWidth = "0";
    const t = document.createElement("span"); t.className = "t"; t.textContent = c.titulo;
    const f = fechaDeId(c.docId);
    const sub = prep ? "Preparando… estará lista en unos minutos" : [c.artista || "", f ? "agregada el " + f.toLocaleDateString("es", { day: "numeric", month: "short", year: "numeric" }) : ""].filter(Boolean).join(" · ");
    const a = document.createElement("span"); a.className = "a"; a.textContent = sub;
    tx.appendChild(t); tx.appendChild(a);
    if (c.nota) { const nt = document.createElement("span"); nt.className = "pie"; nt.textContent = c.nota; tx.appendChild(nt); }
    info.appendChild(img); info.appendChild(tx);

    const acc = document.createElement("span"); acc.className = "acc";
    const eq = document.createElement("span"); eq.className = "eq"; eq.setAttribute("aria-hidden", "true"); eq.innerHTML = "<i></i><i></i><i></i><i></i>";
    const esFav = favs.has(c.docId);
    const fv = document.createElement("button"); fv.className = "fv" + (esFav ? " on" : ""); fv.innerHTML = HEART_SVG;
    fv.setAttribute("aria-label", (esFav ? "Quitar de favoritas: " : "Marcar como favorita: ") + c.titulo); fv.setAttribute("aria-pressed", esFav);
    fv.onclick = ev => { ev.stopPropagation(); favs.has(c.docId) ? favs.delete(c.docId) : favs.add(c.docId); guardarFavs(); pintarFilas(); };
    const ed = document.createElement("button"); ed.className = "ed"; ed.textContent = "✎"; ed.title = "Escribir una nota"; ed.setAttribute("aria-label", "Nota de " + c.titulo);
    ed.onclick = ev => { ev.stopPropagation(); editarNota(c); };
    const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.title = "Quitar de la lista"; x.setAttribute("aria-label", "Quitar " + c.titulo);
    x.onclick = ev => { ev.stopPropagation(); quitar(c); };
    acc.appendChild(eq); acc.appendChild(fv); acc.appendChild(ed); acc.appendChild(x);

    r.appendChild(n); r.appendChild(info); r.appendChild(acc);
    r.onclick = () => { if (prep) { toast("Esta canción se está publicando, espera unos minutos"); return; } if (c.docId === sonandoDocId && cola.length) toggle(); else { cola = colaVisible.slice(); play(pos); } };
    rows.appendChild(r);
  });
}

function editarNota(c){
  if (!editando) return;
  const txt = prompt("Nota para \"" + c.titulo + "\" (déjala vacía para quitarla):", c.nota || "");
  if (txt === null) return;
  const lid = listaActual;
  modificarListas(d => {
    const s = (d[lid] || []).find(z => z.docId === c.docId);
    if (s) { if (txt.trim()) s.nota = txt.trim(); else delete s.nota; }
  }, "Nota en " + c.titulo).then(() => toast("Nota guardada")).catch(e => toast("No se pudo guardar la nota: " + e.message));
}

/* ---------- Editar: token, agregar, quitar ---------- */
function setEditando(v){
  editando = v;

async function buscar(){
  const q = $("q").value.trim();
  if (!q) { toast("Escribe el nombre de una canción"); return; }
  const dl = CONFIG.evogbKey;
  const cont = $("resultados"); cont.hidden = false; cont.innerHTML = '<div class="nota">Buscando…</div>';
  try {
    const r = await fetch(CONFIG.buscaEndpoint + "?key=" + encodeURIComponent(dl) + "&query=" + encodeURIComponent(q));
    const j = await r.json();
    if (!j.status) throw new Error(j.reason || j.message || j.msg || ("HTTP " + r.status));
    cont.innerHTML = "";
    const items = (j.result || []).map(it => {
      const m = String(it.url || "").match(/[?&]v=([\w-]{11})/) || String(it.url || "").match(/youtu\.be\/([\w-]{11})/);
      return m ? { vid: m[1], titulo: it.title, canal: it.autor || "", dur: it.duration || "", thumb: it.banner || "" } : null;
    }).filter(Boolean).slice(0, 8);
    if (!items.length) { cont.innerHTML = '<div class="nota">No encontré nada. Prueba con otro nombre.</div>'; return; }
    items.forEach(v => {
      const fila = document.createElement("div"); fila.className = "it";
      const im = document.createElement("img"); im.alt = ""; im.src = v.thumb;
      const tx = document.createElement("div"); tx.className = "tx";
      const t = document.createElement("div"); t.className = "t"; t.textContent = v.titulo;
      const a = document.createElement("div"); a.className = "a"; a.textContent = v.canal + (v.dur ? " · " + v.dur : "");
      tx.appendChild(t); tx.appendChild(a);
      const bt = document.createElement("button"); bt.className = "btn"; bt.textContent = "Agregar";
      if (canciones.some(c => c.id === v.vid)) { bt.textContent = "Ya está"; bt.disabled = true; }
      bt.onclick = () => anadirMp3(v, bt);
      fila.appendChild(im); fila.appendChild(tx); fila.appendChild(bt);
      cont.appendChild(fila);
    });
  } catch (e) {
    console.error(e);
    cont.innerHTML = "";
    const n = document.createElement("div"); n.className = "nota";
    n.textContent = "No se pudo buscar: " + (e.message === "Failed to fetch" ? "el navegador bloqueó la conexión (CORS) con la API." : e.message);
    cont.appendChild(n);
  }
}

function aBase64(buf){ const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }

async function anadirMp3(v, boton){
  if (!editando) { toast("Primero entra en Editar listas"); return; }
  const lista = listaActual;
  boton.disabled = true;
  try {
    estado("1/3 Pidiendo el mp3…");
    const r = await fetch(CONFIG.descargaEndpoint + "?key=" + encodeURIComponent(CONFIG.evogbKey) + "&url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + v.vid));
    const j = await r.json();
    const enlace = j && j.data && j.data.dl;
    if (!j.status || !enlace) throw new Error("La API no devolvió enlace (" + (j.reason || j.message || j.msg || r.status) + ")");
    estado("2/3 Descargando el audio…");
    const f = await fetch(enlace);
    if (!f.ok) throw new Error("No se pudo bajar el archivo (" + f.status + ")");
    const contenido = aBase64(await f.arrayBuffer());
    estado("3/3 Subiendo al repositorio…");
    const ruta = "musica/" + v.vid + ".mp3";
    const u = await fetch(API + ruta, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, hdr()),
      body: JSON.stringify({ message: "Agregar " + v.titulo, content: contenido, branch: G.rama || "main" })
    });
    if (!u.ok && u.status !== 422) throw new Error("GitHub respondió " + u.status + (u.status === 401 ? " (token inválido)" : u.status === 403 ? " (al token le falta el permiso Contents: Read and write)" : ""));
    await agregar({ tipo: "mp3", id: v.vid, titulo: v.titulo, artista: v.canal, thumb: v.thumb, url: ruta, disponible: Date.now() + 150000 }, lista);
    boton.textContent = "Agregada";
    estado("Listo. Saldrá como «Preparando…» unos minutos mientras GitHub la publica.");
  } catch (e) {
    console.error(e); boton.disabled = false;
    estado("No se pudo agregar: " + (e.message === "Failed to fetch" ? "el navegador bloqueó la conexión (CORS) con la API." : e.message));
  }
}

/* ---------- Visor estilo Apple Music con letra (LRCLIB, sin clave) ---------- */
let visorAbierto = false, letraLineas = [], letraSincro = false, letraIdx = -1;
const cacheLetras = {};
const limpiar = t => (t || "").replace(/\([^)]*\)|\[[^\]]*\]/g, " ").replace(/\b(official|video oficial|music video|lyrics?|letra|audio|hd|4k|mv|vevo|topic)\b/gi, " ").replace(/\s+/g, " ").replace(/^[\s-]+|[\s-]+$/g, "");
const consulta = c => { const t = limpiar(c.titulo); return t.includes(" - ") ? t : (t + " " + limpiar(c.artista)).trim(); };
const durActual = () => { const d = modo === "yt" && ytListo ? yt.getDuration() : audio.duration; return isFinite(d) ? d : 0; };

function parseLRC(txt){
  const out = [];
  txt.split("\n").forEach(l => {
    const tiempos = [...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    const x = l.replace(/\[[^\]]*\]/g, "").trim() || "♪";
    tiempos.forEach(m => out.push({ t: +m[1] * 60 + +m[2], x: x }));
  });
  return out.sort((a, b) => a.t - b.t);
}
async function buscarLetra(q, dur){
  const r = await fetch("https://lrclib.net/api/search?q=" + encodeURIComponent(q));
  if (!r.ok) throw new Error("HTTP " + r.status);
  const lista = (await r.json()).filter(x => x.syncedLyrics || x.plainLyrics);
  if (!lista.length) return null;
  if (dur > 0) lista.sort((a, b) => Math.abs((a.duration || 0) - dur) - Math.abs((b.duration || 0) - dur));
  return lista.find(x => x.syncedLyrics && (!dur || Math.abs((x.duration || 0) - dur) <= 10)) || lista[0];
}
function pintarLetra(lineas, msg){
  const cont = $("letra"); cont.innerHTML = ""; cont.scrollTop = 0;
  cont.classList.toggle("plana", !letraSincro);
  if (msg) { const d = document.createElement("div"); d.className = "aviso2"; d.textContent = msg; cont.appendChild(d); return; }
  lineas.forEach((l, i) => {
    const p = document.createElement("p"); p.textContent = l.x;
    if (letraSincro) p.onclick = () => irA(l.t);
    cont.appendChild(p);
  });
}
function irA(t){
  if (modo === "yt" && ytListo) yt.seekTo(t, true);
  else if (modo === "mp3") audio.currentTime = t;
}
async function cargarLetra(c, q){
  letraLineas = []; letraIdx = -1; letraSincro = false;
  pintarLetra([], "Buscando la letra…");
  if (durActual() === 0) await new Promise(r => setTimeout(r, 1500));
  if (sonandoDocId !== c.docId) return;
  try {
    const dur = durActual(), clave = q + "|" + Math.round(dur / 5);
    let res = cacheLetras[clave];
    if (res === undefined) { res = await buscarLetra(q, dur); cacheLetras[clave] = res; }
    if (sonandoDocId !== c.docId) return;
    if (!res) { pintarLetra([], "No encontré la letra de esta canción. Prueba corregir la búsqueda arriba (ej: artista y nombre)."); return; }
    if (res.syncedLyrics) { letraSincro = true; letraLineas = parseLRC(res.syncedLyrics); }
    else { letraLineas = res.plainLyrics.split("\n").map(x => ({ t: 0, x: x || " " })); }
    pintarLetra(letraLineas);
  } catch (e) {
    console.error(e);
    pintarLetra([], "No se pudo cargar la letra" + (e.message === "Failed to fetch" ? " (conexión bloqueada)." : "."));
  }
}
function actualizarLetra(cur){
  if (!visorAbierto || !letraSincro || !letraLineas.length) return;
  let i = -1;
  for (let k = 0; k < letraLineas.length; k++) { if (letraLineas[k].t <= cur + 0.3) i = k; else break; }
  if (i === letraIdx) return;
  letraIdx = i;
  const ps = $("letra").children;
  for (let k = 0; k < ps.length; k++) ps[k].classList.toggle("on", k === i);
  if (i >= 0 && ps[i]) { const cont = $("letra"); cont.scrollTo({ top: ps[i].offsetTop - cont.clientHeight / 2 + ps[i].clientHeight / 2, behavior: "smooth" }); }
}
function prepararVisor(c){

  $("vTitulo").textContent = c.titulo; $("vArtista").textContent = c.artista || ""; $("vNota").textContent = c.nota || "";
  const q = consulta(c); $("vQ").value = q;
  cargarLetra(c, q);
}

/* ---------- Nuestro cielo: estrellas dibujadas con la fecha de juntosDesde ---------- */
window.Cielo = (function(){
  const cv = $("cieloCanvas"), cx = cv.getContext("2d"), caja = $("cieloCaja");
  const reducir = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const [Y, M, D] = CONFIG.juntosDesde.split("-").map(Number);
  const fecha = new Date(Y, M - 1, D).toLocaleDateString("es", { day: "numeric", month: "long", year: "numeric" });
  $("cieloTitulo").textContent = CONFIG.cieloTitulo;
  $("cieloFecha").textContent = fecha;
  $("cieloTexto").textContent = CONFIG.cieloTexto;

  /* El mismo cielo cada vez: las estrellas salen de la fecha */
  let semilla = 0; for (const ch of CONFIG.juntosDesde + "cielo") semilla = (semilla * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = (a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(semilla);
  const estrellas = Array.from({ length: 170 }, () => ({ x: rnd(), y: rnd(), r: .3 + rnd() * 1.3, a: .35 + rnd() * .65, f: rnd() * 6.28, v: .6 + rnd() * 1.6, c: Math.floor(rnd() * 3) }));
  const corazon = [];
  for (let i = 0; i < 16; i++) { const t = i / 16 * Math.PI * 2; corazon.push({ x: 16 * Math.pow(Math.sin(t), 3), y: 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t) }); }
  const FUENTE = "'Noto Sans','Helvetica Neue',Arial,sans-serif";

  function dibujar(c, w, h, t, off, texto){
    const k = w / 400;
    const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#140a24"); g.addColorStop(.55, "#341446"); g.addColorStop(1, "#5a1d48");
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    const capas = [5, 10, 18];
    c.fillStyle = "#fff";
    for (const e of estrellas) {
      c.globalAlpha = e.a * (.7 + .3 * Math.sin(t * e.v + e.f));
      c.beginPath(); c.arc(e.x * w + off.x * capas[e.c] * k, e.y * h + off.y * capas[e.c] * k, e.r * k * 1.1 + .2, 0, 6.283); c.fill();
    }
    c.globalAlpha = 1;
    const s = w * .0175, mx = w / 2 + off.x * 14 * k, my = h * .42 + off.y * 14 * k;
    const pts = corazon.map(p => ({ x: mx + p.x * s, y: my - p.y * s }));
    c.strokeStyle = "rgba(255,107,157,.6)"; c.lineWidth = Math.max(1, k); c.setLineDash([4 * k, 7 * k]);
    c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)); c.closePath(); c.stroke(); c.setLineDash([]);
    pts.forEach((p, i) => {
      const br = .75 + .25 * Math.sin(t * 1.3 + i), gr = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, 12 * k);
      gr.addColorStop(0, "rgba(255,160,196," + (.55 * br) + ")"); gr.addColorStop(1, "rgba(255,107,157,0)");
      c.fillStyle = gr; c.beginPath(); c.arc(p.x, p.y, 12 * k, 0, 6.283); c.fill();
      c.fillStyle = "#ffe3ee"; c.beginPath(); c.arc(p.x, p.y, 2.6 * k, 0, 6.283); c.fill();
    });
    if (texto) {
      c.textAlign = "center"; c.fillStyle = "#fff5f8"; c.font = "700 " + Math.round(w * .05) + "px " + FUENTE; c.fillText(texto[0], w / 2, h * .82);
      c.fillStyle = "#d9b3c3"; c.font = "400 " + Math.round(w * .034) + "px " + FUENTE; c.fillText(texto[1], w / 2, h * .82 + w * .07);
    }
  }

  let raf = 0, activo = false, ultimo = 0, w = 0, h = 0;
  const objetivo = { x: 0, y: 0 }, off = { x: 0, y: 0 };
  function medir(){
    const r = caja.getBoundingClientRect(); if (!r.width || !r.height) return false;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    w = r.width; h = r.height; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cx.setTransform(dpr, 0, 0, dpr, 0, 0); return true;
  }
  function marco(ts){
    if (!activo) return; raf = requestAnimationFrame(marco);
    if (ts - ultimo < 33) return; ultimo = ts;
    off.x += (objetivo.x - off.x) * .08; off.y += (objetivo.y - off.y) * .08;
    dibujar(cx, w, h, ts / 1000, off);
  }
  function quieto(){ if (medir()) dibujar(cx, w, h, 0, { x: 0, y: 0 }); }

  caja.addEventListener("pointermove", e => { const r = caja.getBoundingClientRect(); objetivo.x = ((e.clientX - r.left) / r.width - .5) * 2; objetivo.y = ((e.clientY - r.top) / r.height - .5) * 2; });
  caja.addEventListener("pointerleave", () => { objetivo.x = 0; objetivo.y = 0; });
  const inclinar = e => { if (e.gamma == null) return; objetivo.x = Math.max(-1, Math.min(1, e.gamma / 30)); objetivo.y = Math.max(-1, Math.min(1, ((e.beta || 45) - 45) / 30)); };
  window.addEventListener("deviceorientation", inclinar);
  let pedido = false;
  caja.addEventListener("pointerdown", () => {
    if (pedido) return; pedido = true;
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") DeviceOrientationEvent.requestPermission().catch(() => {});
  });
  window.addEventListener("resize", () => { if (activo && reducir) quieto(); else if (activo) medir(); });

  $("btnCielo").onclick = () => {
    const W = 1080, Hh = 1920, c = document.createElement("canvas"); c.width = W; c.height = Hh;
    dibujar(c.getContext("2d"), W, Hh, 0, { x: 0, y: 0 }, [fecha, CONFIG.cieloTexto]);
    c.toBlob(b => {
      if (!b) { toast("No se pudo guardar la imagen"); return; }
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "nuestro-cielo.png";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("Imagen guardada. Úsala de fondo de pantalla");
    }, "image/png");
  };

  return {
    entrar(){ if (activo) return; activo = true; if (reducir) quieto(); else { medir(); raf = requestAnimationFrame(marco); } },
    salir(){ activo = false; cancelAnimationFrame(raf); }
  };
})();

/* ---------- Juego del dinosaurio ---------- */
window.Juego = (function(){
  const cv = $("jCanvas"), cx = cv.getContext("2d"), caja = $("jCaja");
  const H = 200, SUELO = 168, G = 2300, SALTO = 640;
  const CORAZON = new Path2D("M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6 5c2 0 3.4 1.1 4.2 2.4h3.6C14.6 6.1 16 5 18 5c3.3 0 5.1 3.4 3.6 6.8C19.5 16.4 12 21 12 21z");
  let W = 600, raf = 0, ultimo = 0, activo = false, estado = "espera", bloqueo = 0, caer = false, ultimoPuntos = -1;
  let dino, obs, fondo, vel, puntos, dist, proximo, tPata;
  let record = +leerLS("regalo_record") || 0, premio = leerLS("regalo_premio") === "1";

  $("juegoTitulo").textContent = CONFIG.juegoTitulo;
  $("jRecord").textContent = record;
  $("jAyuda").textContent = "Toca la pantalla, o pulsa espacio o flecha arriba, para saltar.";
  function mostrarPremio(){ $("jPremio").hidden = false; conCorazones($("jPremioTxt"), CONFIG.juegoPremioTexto); $("jAyuda").hidden = true; }
  if (premio) mostrarPremio();

  function medir(){
    const r = caja.getBoundingClientRect(); if (!r.width || !r.height) return;
    const sc = r.height / H, dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width / sc; cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); cx.setTransform(dpr * sc, 0, 0, dpr * sc, 0, 0);
  }
  function reiniciar(){
    dino = { x: 44, y: SUELO, vy: 0 }; obs = []; vel = 290; puntos = 0; dist = 0; proximo = 260; tPata = 0; caer = false;
    fondo = Array.from({ length: 6 }, (_, i) => ({ x: i * W / 5 + Math.random() * 60, y: 14 + Math.random() * 70, s: .5 + Math.random() * .5 }));
  }
  function mensaje(txt, sub){ const m = $("jMsg"); conCorazones($("jMsgTxt"), txt); $("jMsgSub").textContent = sub || ""; m.hidden = false; }
  function empezar(){ reiniciar(); estado = "juego"; $("jMsg").hidden = true; }
  function saltar(){
    if (estado !== "juego") { if (performance.now() < bloqueo) return; empezar(); dino.vy = -SALTO; return; }
    if (dino.y >= SUELO - .5) { dino.vy = -SALTO; caer = false; }
  }
  function terminar(){
    estado = "fin"; bloqueo = performance.now() + 450;
    const p = Math.floor(puntos); let nuevo = false;
    if (p > record) { record = p; nuevo = true; escribirLS("regalo_record", String(p)); $("jRecord").textContent = p; }
    const f = CONFIG.juegoFrases; 
    mensaje(f[Math.floor(Math.random() * f.length)], p + " puntos" + (nuevo ? " · nuevo récord" : "") + ". Toca para intentarlo otra vez");
  }
  function crearObstaculo(){
    const n = 1 + (Math.random() < .35 ? 1 : 0) + (Math.random() < .15 ? 1 : 0);
    obs.push({ x: W + 20, w: n * 19 + (n - 1) * 2, h: 34 + Math.floor(Math.random() * 20), n });
  }
  function actualizar(dt){
    vel = Math.min(300 + puntos * .5, 720);
    puntos += vel * dt * .04; dist += vel * dt; tPata += dt;
    dino.vy += (caer ? G * 2.2 : G) * dt; dino.y += dino.vy * dt;
    if (dino.y >= SUELO) { dino.y = SUELO; dino.vy = 0; }
    obs.forEach(o => o.x -= vel * dt); obs = obs.filter(o => o.x + o.w > -10);
    if (dist >= proximo) { crearObstaculo(); proximo = dist + vel * .6 + 60 + Math.random() * vel * .7; }
    fondo.forEach(c => { c.x -= vel * dt * .15; if (c.x < -20) { c.x = W + 20; c.y = 14 + Math.random() * 70; } });
    for (const o of obs) {
      if (dino.x + 7 < o.x + o.w - 3 && dino.x + 36 > o.x + 3 && dino.y - 4 > SUELO - o.h + 4) { terminar(); return; }
    }
    if (!premio && puntos >= CONFIG.juegoPremioPuntos) { premio = true; escribirLS("regalo_premio", "1"); mostrarPremio(); toast(MSG_ANIMO); }
  }

  function dibujarDino(muerto){
    const u = 3, x = dino.x, y = dino.y - 48, R = (a, b, w, h) => cx.fillRect(x + a * u, y + b * u, w * u, h * u);
    cx.fillStyle = "#ff6b9d";
    R(7, 0, 7, 6); R(3, 5, 8, 7); R(0, 7, 3, 3); R(11, 8, 2, 1);
    const aire = dino.y < SUELO - .5 || estado !== "juego", p = aire ? 2 : Math.floor(tPata / .09) % 2;
    R(4, 12, 3, p === 0 ? 4 : 2); R(8, 12, 3, p === 1 ? 4 : 2);
    cx.fillStyle = "#1c0f16";
    if (muerto) { R(10, 1, 1, 1); R(12, 1, 1, 1); R(11, 2, 1, 1); R(10, 3, 1, 1); R(12, 3, 1, 1); } else R(11, 1, 1, 1);
    R(11, 4, 3, 1);
  }
  function dibujarCactus(o){
    cx.fillStyle = "#f3cfdc";
    for (let i = 0; i < o.n; i++) {
      const x = o.x + i * 21, y = SUELO - o.h, h = o.h;
      cx.fillRect(x + 5, y, 7, h);
      cx.fillRect(x, y + h * .45, 5, 4); cx.fillRect(x, y + h * .25, 4, h * .2 + 4);
      cx.fillRect(x + 12, y + h * .55, 5, 4); cx.fillRect(x + 13, y + h * .35, 4, h * .2 + 4);
    }
  }
  function pintar(){
    cx.clearRect(0, 0, W, H);
    cx.fillStyle = "rgba(255,107,157,.14)";
    fondo.forEach(c => { cx.save(); cx.translate(c.x, c.y); cx.scale(c.s * 1.2, c.s * 1.2); cx.fill(CORAZON); cx.restore(); });
    cx.fillStyle = "#5c3a4a"; cx.fillRect(0, SUELO + 1, W, 2);
    const o0 = dist % 46; for (let x = -o0; x < W; x += 46) cx.fillRect(x, SUELO + 9, 14, 2);
    obs.forEach(dibujarCactus);
    dibujarDino(estado === "fin");
    const p = Math.floor(puntos);
    if (p !== ultimoPuntos) { ultimoPuntos = p; $("jPuntos").textContent = String(p).padStart(5, "0"); }
  }
  function bucle(ts){
    if (!activo) return; raf = requestAnimationFrame(bucle);
    const dt = Math.min(.033, ultimo ? (ts - ultimo) / 1000 : 0); ultimo = ts;
    if (estado === "juego") actualizar(dt);

  }

  caja.addEventListener("pointerdown", e => { e.preventDefault(); saltar(); });
  document.addEventListener("keydown", e => {

  });

  window.addEventListener("resize", () => { if (activo) medir(); });

  return {
    entrar(){ if (activo) return; activo = true; ultimo = 0; medir(); reiniciar(); estado = "espera"; ultimoPuntos = -1; mensaje(CONFIG.juegoInicio); raf = requestAnimationFrame(bucle); },
    salir(){ activo = false; cancelAnimationFrame(raf); estado = "espera"; }
  };
})();

/* ---------- Rompecabezas ---------- */
window.Puzzle = (function(){
  const tab = $("pzTablero"), caja = $("pzCaja"), cont = $("pzFotos"), fotos = CONFIG.puzzleFotos;
  let n = +leerLS("regalo_pz_n") === 4 ? 4 : 3, f = 0, orden = [], sel = -1, movs = 0, t0 = 0, tiempo = 0, timer = 0, activo = false, listo = false, ratio = 1;
  const imgs = [];
  $("pzTitulo").textContent = CONFIG.puzzleTitulo;
  const tm = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  const clave = () => "regalo_pz_" + f + "_" + n;
  function info(){ const r = +leerLS(clave()) || 0; $("pzInfo").textContent = movs + " mov · " + tm(tiempo) + (r ? " · mejor " + r : ""); }

  fotos.forEach((u, i) => {
    const b = document.createElement("button"); b.style.backgroundImage = 'url("' + u + '")'; b.setAttribute("aria-label", "Foto " + (i + 1));
    b.onclick = () => { f = i; nuevo(); }; cont.appendChild(b);
  });
  function marcar(){
    [...cont.children].forEach((b, i) => b.classList.toggle("on", i === f));
    document.querySelectorAll("#pzNivel .chip").forEach(c => c.classList.toggle("on", +c.dataset.n === n));
    $("pzPrev").style.backgroundImage = 'url("' + fotos[f] + '")';
  }
  function pintar(){
    tab.style.gridTemplateColumns = tab.style.gridTemplateRows = "repeat(" + n + ",1fr)";
    tab.innerHTML = "";
    const aw = Math.max(ratio, 1) * n, ah = Math.max(1 / ratio, 1) * n; /* la foto se recorta al centro, como "cover" */
    orden.forEach((p, i) => {
      const b = document.createElement("button"), c = p % n, r = Math.floor(p / n);
      b.className = "pz-pieza" + (i === sel ? " sel" : "");
      b.style.backgroundImage = 'url("' + fotos[f] + '")';
      b.style.backgroundSize = aw * 100 + "% " + ah * 100 + "%";
      b.style.backgroundPosition = (c + (aw - n) / 2) / (aw - 1) * 100 + "% " + (r + (ah - n) / 2) / (ah - 1) * 100 + "%";
      b.setAttribute("aria-label", "Pieza " + (i + 1) + " de " + n * n);
      b.onclick = () => tocar(i);
      tab.appendChild(b);
    });
  }
  function nuevo(){
    const k = f, im = imgs[k] || (imgs[k] = new Image());
    function seguir(){
      if (k !== f) return;
      ratio = im.naturalWidth / im.naturalHeight || 1;
      orden = Array.from({ length: n * n }, (_, i) => i);
      do { for (let i = orden.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [orden[i], orden[j]] = [orden[j], orden[i]]; } }
      while (orden.every((p, i) => p === i));
      sel = -1; movs = 0; t0 = 0; tiempo = 0; listo = false;
      tab.classList.remove("listo"); $("pzPremio").hidden = true;
      caja.classList.remove("ver"); $("pzVer").classList.remove("on"); $("pzVer").setAttribute("aria-pressed", "false");
      marcar(); pintar(); info();
    }
    if (im.complete && im.naturalWidth) seguir();

  }
  function tocar(i){
    if (listo) return;

    if (!t0) t0 = Date.now();
    [orden[sel], orden[i]] = [orden[i], orden[sel]]; sel = -1; movs++;

  return {
    entrar(){ if (activo) return; activo = true; if (!orden.length) nuevo(); timer = setInterval(() => { if (t0 && !listo) { tiempo = Math.round((Date.now() - t0) / 1000); info(); } }, 1000); },
    salir(){ activo = false; clearInterval(timer); }

/* ---------- Memorama ---------- */
window.Memo = (function(){

  const dormir = ms => new Promise(r => setTimeout(r, ms));

  }

  return {
    entrar(){ if (activo) return; activo = true; if (!cartas.length) nuevo(); },
    salir(){ activo = false; }

    pose(SEP.abrazo, 3, 0, { R: CINTURA_B }, { L: CINTURA_A }); await esperar(1000); if (mi !== tk) return false;
    lluvia(5, 0, 150); await esperar(2300); if (mi !== tk) return false;
    pose(SEP.abre, 0, 0, { R: "abre" }, { L: "abre" }); await esperar(800); if (mi !== tk) return false;
    pose(SEP.idle, 0, 0, {}, {}); await esperar(900); return mi === tk;
  }
  async function sBeso(mi){
    pose(SEP.abre, 0, 0, { R: "abre" }, { L: "abre" }); await esperar(1100); if (mi !== tk) return false;
    pose(SEP.beso, 8, 0, { R: CUELLO_B }, { L: HOMBRO_A }); await esperar(1100); if (mi !== tk) return false;
    saltar(A); saltar(B); flotar("bs-h g", HEART_SVG, 0, 205, 0); lluvia(7, 0, 170);
    await esperar(2300); if (mi !== tk) return false;
    pose(SEP.abre, 0, 0, { R: "abre" }, { L: "abre" }); await esperar(800); if (mi !== tk) return false;
    pose(SEP.idle, 0, 0, {}, {}); await esperar(900); return mi === tk;
  }
  async function correr(nombre){
    const mi = ++tk; esc = nombre;
    chips.forEach(c => c.classList.toggle("on", c.dataset.esc === nombre));
    if (nombre === "todo") {
      while (mi === tk) {
        if (!await sBaile(mi, 5500)) return;
        if (!await sBeso(mi)) return;
        if (!await sBaile(mi, 4500)) return;
        if (!await sAbrazo(mi)) return;
      }
    } else if (nombre === "baile") { await sBaile(mi, 0); }
    else { if (!(nombre === "beso" ? await sBeso(mi) : await sAbrazo(mi))) return; await sBaile(mi, 0); }
  }
  chips.forEach(c => c.onclick = () => correr(c.dataset.esc));
  cv.addEventListener("pointerdown", e => {
    const r = cv.getBoundingClientRect(), px = (e.clientX - r.left) / K - SW / 2;
    const c = Math.abs(px - A.x) < Math.abs(px - B.x) ? A : B;
    saltar(c); corazon(c.x, 175);
  });

  return {
    entrar(){
      if (activo) return; activo = true; cargar(); medir(); ultimo = 0;
      notas = setInterval(() => { if (bailaObj < .5) return; const l = Math.random() < .5; flotar("bs-nt", Math.random() < .5 ? "♪" : "♫", (l ? -1 : 1) * (70 + Math.random() * 60), 190 + Math.random() * 40, (l ? -1 : 1) * 25); }, 800);
      raf = requestAnimationFrame(marco); correr(esc);
    },
    salir(){ activo = false; tk++; clearInterval(notas); cancelAnimationFrame(raf); fx.innerHTML = ""; }
  };
})();

/* ---------- Páginas: 1 bienvenida, 2 tiempo + mensaje, 3 playlist, 4 juego, 5 rompecabezas, 6 pupiletras ---------- */
function aplicarPagina(){
  const p = location.hash === "#playlist" ? "playlist" : location.hash === "#juego" ? "juego" : location.hash === "#puzzle" ? "puzzle" : location.hash === "#pupiletras" ? "pupi" : location.hash === "#memorama" ? "memo" : location.hash === "#baile" ? "baile" : "tiempo";
  document.body.dataset.pagina = p;
  window.scrollTo(0, 0);
  if (p !== "playlist" && visorAbierto) cerrarVisor();
  if (window.Cielo) p === "tiempo" ? Cielo.entrar() : Cielo.salir();
  if (window.Juego) p === "juego" ? Juego.entrar() : Juego.salir();
  if (window.Puzzle) p === "puzzle" ? Puzzle.entrar() : Puzzle.salir();
  if (window.Pupi) p === "pupi" ? Pupi.entrar() : Pupi.salir();
  if (window.Memo) p === "memo" ? Memo.entrar() : Memo.salir();
  if (window.Baile) p === "baile" ? Baile.entrar() : Baile.salir();
}
